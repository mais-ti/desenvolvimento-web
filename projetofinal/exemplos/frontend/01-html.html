<!DOCTYPE html>
<!-- DOCTYPE informa que usamos HTML5. lang identifica o idioma da página. -->
<html lang="pt-BR">
<head>
  <!-- head guarda configurações; UTF-8 permite exibir acentos corretamente. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01 — HTML</title>
</head>
<body>
  <!-- body contém o que aparece na página. h1 é o título principal. -->
  <h1>Esquina do Sabor</h1>
  <p>Conheça nosso cardápio:</p>

  <!-- ul cria uma lista; cada li representa um item dessa lista. -->
  <ul>
    <li>Pastel — R$ 10,00</li>
    <li>Suco — R$ 5,00</li>
  </ul>

  <!-- href define o destino do link. O arquivo está na mesma pasta. -->
  <a href="02-css.html">Próximo exemplo: CSS</a>
</body>
</html>
